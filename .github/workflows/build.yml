name: AirSense CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build AirSense Server (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AirSense.Server/AirSense.Server.csproj

    - name: Build Server
      run: dotnet build AirSense.Server/AirSense.Server.csproj --configuration Release --no-restore

    - name: Publish Windows Standalone Executable
      run: dotnet publish AirSense.Server/AirSense.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/server

    - name: Upload Windows Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./publish/server/AirSense.Server.exe

  build-android:
    name: Build AirSense Client (Android APK)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android Project Runner
      run: |
        cd AirSense.Client
        flutter create . --project-name air_sense_client --org com.airsense.controller --platforms=android

    - name: Configure NDK and Permissions
      run: |
        # Locate pre-installed NDK
        PREINSTALLED_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n 1)
        echo "Found Runner NDK: $PREINSTALLED_NDK"
        
        # Symlink preferred NDK 28.2.13676358 to pre-installed NDK so plugins (:jni) find it immediately
        sudo ln -s "/usr/local/lib/android/sdk/ndk/$PREINSTALLED_NDK" "/usr/local/lib/android/sdk/ndk/28.2.13676358" || true
        
        # Configure ndk.dir in local.properties
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> AirSense.Client/android/local.properties

        # Inject networking, vibration & sensor permissions into AndroidManifest.xml
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.hardware.HIGH_SAMPLING_RATE_SENSORS"\/>\n    <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS"\/>/' AirSense.Client/android/app/src/main/AndroidManifest.xml

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build Android APK
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd AirSense.Client
        flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Output
      run: |
        mkdir -p ./release-apk
        cp AirSense.Client/build/app/outputs/flutter-apk/app-release.apk ./release-apk/AirSense-v1.3.2.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-apk/AirSense-v1.3.2.apk

  build-ios:
    name: Build AirSense Client (iOS IPA)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build iOS Application Bundle
      run: |
        cd AirSense.Client
        flutter build ios --release --no-codesign

    - name: Package Sideloadable IPA
      run: |
        mkdir -p ./release-ios/Payload
        cp -r AirSense.Client/build/ios/iphoneos/Runner.app ./release-ios/Payload/
        cd ./release-ios
        zip -r -y AirSense-v1.3.2.ipa Payload
        cd ..

    - name: Upload iOS IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-iOS-IPA
        path: ./release-ios/AirSense-v1.3.2.ipa

  release:
    name: Publish Unified Multi-Platform Release
    needs: [build-server, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Download Windows Server Artifact
      uses: actions/download-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./release-assets/server

    - name: Download Android APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-assets/android

    - name: Download iOS IPA Artifact
      uses: actions/download-artifact@v4
      with:
        name: AirSense-iOS-IPA
        path: ./release-assets/ios

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.2-release
        name: "AirSense v1.3.2 (Windows, Android & iOS)"
        body: |
          ### 📥 AirSense v1.3.2 Downloads
          - **📱 Android Client APK:** [**`AirSense-v1.3.2.apk`**](https://github.com/ramsforge/AirSense/releases/download/v1.3.2-release/AirSense-v1.3.2.apk)
          - **🍏 iOS Client IPA:** [**`AirSense-v1.3.2.ipa`**](https://github.com/ramsforge/AirSense/releases/download/v1.3.2-release/AirSense-v1.3.2.ipa)
          - **💻 Windows PC Server:** [**`AirSense.Server.exe`**](https://github.com/ramsforge/AirSense/releases/download/v1.3.2-release/AirSense.Server.exe)

          ---

          ### What's New in v1.3.2:
          - **🍏 Official iOS Support:** Sideloadable `.ipa` bundle for iPhone and iPad, installable via AltStore, Sideloadly, TrollStore, Scarlet, or Apple Configurator.
          - **🏎️ Tilt-Wheel Steering (Mobile Racing Style):** Physically tilt your phone like a steering wheel to drive cars in PC racing games (*Forza Horizon, Need for Speed, F1, Assetto Corsa*).
          - **🔄 Corrected Steering Direction:** Naturally steering left turns left, steering right turns right.
          - **🎮 Direct LeftThumbstickX Mapping:** Maps gravity-referenced landscape rotation directly to `LeftStickX` (`-32768` to `+32767`) with 100% native compatibility with all PC games.
          - **🛡️ Dual-Sensor Fallback (Accelerometer + Gyro):** Resilient dual-sensor pipeline with zero dropped frames or sensor crashes.
          - **🎯 Center Deadzone & Power Curve:** ±4.5° center deadzone ensures rock-solid highway straight-line stability, paired with a non-linear sensitivity curve for nimble hairpin cornering.
          - **📊 Visual Steering Leveling Gauge:** Real-time steering needle & deflection bar in the header and stick area. Tap to calibrate resting neutral angle; double-tap to invert direction.

          ---

          ### Quick Start:
          1. **Windows PC:** Download and run `AirSense.Server.exe`.
          2. **Mobile Device:**
             - **Android:** Download and install `AirSense-v1.3.2.apk`.
             - **iOS:** Download `AirSense-v1.3.2.ipa` and sideload via [AltStore](https://altstore.io), [Sideloadly](https://sideloadly.io), or [TrollStore](https://github.com/opa334/TrollStore).
          3. Ensure both devices are on the same Wi-Fi, tap Connect, and enjoy!
        files: |
          ./release-assets/server/AirSense.Server.exe
          ./release-assets/android/AirSense-v1.3.2.apk
          ./release-assets/ios/AirSense-v1.3.2.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
