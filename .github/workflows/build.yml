name: AirSense CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build AirSense Server (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AirSense.Server/AirSense.Server.csproj

    - name: Build Server
      run: dotnet build AirSense.Server/AirSense.Server.csproj --configuration Release --no-restore

    - name: Publish Windows Standalone Executable
      run: dotnet publish AirSense.Server/AirSense.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/server

    - name: Upload Windows Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./publish/server/AirSense.Server.exe

  build-client:
    name: Build AirSense Client (Android APK)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android Project Runner
      run: |
        cd AirSense.Client
        flutter create . --project-name air_sense_client --org com.airsense.controller --platforms=android

    - name: Configure NDK Environment and Symlinks
      run: |
        # Locate pre-installed NDK
        PREINSTALLED_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n 1)
        echo "Found Runner NDK: $PREINSTALLED_NDK"
        
        # Symlink requested 28.2.13676358 to pre-installed NDK so :jni plugin resolves without network download
        sudo ln -s "/usr/local/lib/android/sdk/ndk/$PREINSTALLED_NDK" "/usr/local/lib/android/sdk/ndk/28.2.13676358" || true
        
        # Write local.properties with ndk.dir
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> AirSense.Client/android/local.properties
        
        # Configure root build.gradle.kts to force ndkVersion across all subprojects (including :jni)
        cat << 'EOF' >> AirSense.Client/android/build.gradle.kts

        subprojects {
            afterEvaluate {
                if (project.hasProperty("android")) {
                    val android = project.extensions.findByName("android")
                    if (android is com.android.build.gradle.BaseExtension) {
                        android.ndkVersion = "28.2.13676358"
                    }
                }
            }
        }
        EOF

        # Inject networking & vibration permissions into AndroidManifest.xml
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>/' AirSense.Client/android/app/src/main/AndroidManifest.xml

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build Android APK
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd AirSense.Client
        flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Output
      run: |
        mkdir -p ./release-apk
        cp AirSense.Client/build/app/outputs/flutter-apk/app-release.apk ./release-apk/AirSense-v1.0.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-apk/AirSense-v1.0.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0-apk
        name: "AirSense Android APK Release (v1.0.0)"
        body: |
          ### AirSense Mobile Controller for Android
          - **Direct Download:** Tap [`AirSense-v1.0.apk`](https://github.com/ramsforge/AirSense/releases/download/v1.0.0-apk/AirSense-v1.0.apk) to install.
          - **Installation:** Open the downloaded `.apk` on your Android phone and tap Install.
          - **Connect:** Ensure your phone is connected to the same Wi-Fi as your PC, start `AirSense.Server.exe`, and tap Connect!
        files: |
          ./release-apk/AirSense-v1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
