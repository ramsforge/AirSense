name: AirSense CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build AirSense Server (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AirSense.Server/AirSense.Server.csproj

    - name: Build Server
      run: dotnet build AirSense.Server/AirSense.Server.csproj --configuration Release --no-restore

    - name: Publish Windows Standalone Executable
      run: dotnet publish AirSense.Server/AirSense.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/server

    - name: Upload Windows Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./publish/server/AirSense.Server.exe

  build-client:
    name: Build AirSense Client (Android APK)
    needs: build-server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Windows Server Artifact
      uses: actions/download-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./release-server

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android Project Runner
      run: |
        cd AirSense.Client
        flutter create . --project-name air_sense_client --org com.airsense.controller --platforms=android

    - name: Configure NDK and Permissions
      run: |
        # Locate pre-installed NDK
        PREINSTALLED_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n 1)
        echo "Found Runner NDK: $PREINSTALLED_NDK"
        
        # Symlink preferred NDK 28.2.13676358 to pre-installed NDK so plugins (:jni) find it immediately
        sudo ln -s "/usr/local/lib/android/sdk/ndk/$PREINSTALLED_NDK" "/usr/local/lib/android/sdk/ndk/28.2.13676358" || true
        
        # Configure ndk.dir in local.properties
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> AirSense.Client/android/local.properties

        # Inject networking, vibration & sensor permissions into AndroidManifest.xml
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.hardware.HIGH_SAMPLING_RATE_SENSORS"\/>\n    <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS"\/>/' AirSense.Client/android/app/src/main/AndroidManifest.xml

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build Android APK
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd AirSense.Client
        flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Output
      run: |
        mkdir -p ./release-apk
        cp AirSense.Client/build/app/outputs/flutter-apk/app-release.apk ./release-apk/AirSense-v1.3.1.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-apk/AirSense-v1.3.1.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.3.1-apk
        name: "AirSense v1.3.1 (Android APK & Windows Server)"
        body: |
          ### 📥 AirSense v1.3.1 Downloads
          - **📱 Android Client APK:** [**`AirSense-v1.3.1.apk`**](https://github.com/ramsforge/AirSense/releases/download/v1.3.1-apk/AirSense-v1.3.1.apk)
          - **💻 Windows PC Server:** [**`AirSense.Server.exe`**](https://github.com/ramsforge/AirSense/releases/download/v1.3.1-apk/AirSense.Server.exe)

          ### What's New in v1.3.1:
          - **🔄 Corrected Steering Direction:** Fixed default steering axis polarity so physically tilting the phone left turns the car left, and tilting right turns right.
          - **🏎️ Tilt-Wheel Steering (Mobile Racing Style):** Physically tilt your phone like a racing wheel to steer cars in PC racing games (*Forza Horizon, Need for Speed, F1, Assetto Corsa*).
          - **🎮 Direct LeftThumbstickX Mapping:** Maps gravity-referenced landscape rotation directly to `LeftStickX` (`-32768` to `+32767`), achieving 100% native compatibility with all PC games without custom in-game gyro setup.
          - **🛡️ Dual-Sensor Fallback (Accelerometer + Gyro):** Resilient dual-sensor pipeline. If gyroscope is unsupported or errors, accelerometer seamlessly calculates steering tilt without disabling motion controls.
          - **🎯 Center Deadzone & Power Curve:** ±4.5° center deadzone ensures rock-solid highway straight-line stability, paired with a non-linear sensitivity curve for nimble hairpin cornering.
          - **📊 Visual Steering Leveling Gauge:** Real-time steering needle & deflection bar in the header and stick area. Tap to calibrate resting neutral angle; double-tap to invert direction.

          ### Quick Start:
          1. Download and run `AirSense.Server.exe` on your PC.
          2. Download and install `AirSense-v1.3.1.apk` on your Android phone.
          3. Tap the helmet/steering icon in the top bar to enable Tilt-Wheel mode, and steer your PC cars naturally!
        files: |
          ./release-apk/AirSense-v1.3.1.apk
          ./release-server/AirSense.Server.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
