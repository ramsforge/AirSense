name: AirSense CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build AirSense Server (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AirSense.Server/AirSense.Server.csproj

    - name: Build Server
      run: dotnet build AirSense.Server/AirSense.Server.csproj --configuration Release --no-restore

    - name: Publish Windows Standalone Executable
      run: dotnet publish AirSense.Server/AirSense.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/server

    - name: Upload Windows Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./publish/server/AirSense.Server.exe

  build-client:
    name: Build AirSense Client (Android APK)
    needs: build-server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download Windows Server Artifact
      uses: actions/download-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./release-server

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android Project Runner
      run: |
        cd AirSense.Client
        flutter create . --project-name air_sense_client --org com.airsense.controller --platforms=android

    - name: Configure NDK and Permissions
      run: |
        # Locate pre-installed NDK
        PREINSTALLED_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n 1)
        echo "Found Runner NDK: $PREINSTALLED_NDK"
        
        # Symlink preferred NDK 28.2.13676358 to pre-installed NDK so plugins (:jni) find it immediately
        sudo ln -s "/usr/local/lib/android/sdk/ndk/$PREINSTALLED_NDK" "/usr/local/lib/android/sdk/ndk/28.2.13676358" || true
        
        # Configure ndk.dir in local.properties
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> AirSense.Client/android/local.properties

        # Inject networking & vibration permissions into AndroidManifest.xml
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>/' AirSense.Client/android/app/src/main/AndroidManifest.xml

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build Android APK
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd AirSense.Client
        flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Output
      run: |
        mkdir -p ./release-apk
        cp AirSense.Client/build/app/outputs/flutter-apk/app-release.apk ./release-apk/AirSense-v1.2.2.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-apk/AirSense-v1.2.2.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.2.2-apk
        name: "AirSense v1.2.2 (Android APK & Windows Server)"
        body: |
          ### 📥 AirSense v1.2.2 Downloads
          - **📱 Android Client APK:** [**`AirSense-v1.2.2.apk`**](https://github.com/ramsforge/AirSense/releases/download/v1.2.2-apk/AirSense-v1.2.2.apk)
          - **💻 Windows PC Server:** [**`AirSense.Server.exe`**](https://github.com/ramsforge/AirSense/releases/download/v1.2.2-apk/AirSense.Server.exe)

          ### What's New in v1.2.2:
          - **Inverted Trigger Progression:** L2 & R2 now actuate to 100% full pull at the top crest and 0% at the bottom, matching natural index finger reach and pull dynamics.
          - **Enlarged Trigger Pedals:** Triggers expanded to 118px length (+51% travel) and widened to 58px (+32% width) for effortless phone edge access.
          - **Tactile Visual Texture:** Added textured grip micro-grooves and top actuation crest indicator to trigger pedals.
          - **Enlarged Bumpers:** L1 and R1 bumpers widened to 58px and heightened to 44px for instant tactile tapping.

          ### Quick Start:
          1. Download and run `AirSense.Server.exe` on your PC.
          2. Download and install `AirSense-v1.2.2.apk` on your Android phone.
          3. Ensure both devices are on the same Wi-Fi, tap Connect, and enjoy!
        files: |
          ./release-apk/AirSense-v1.2.2.apk
          ./release-server/AirSense.Server.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
