name: AirSense CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Build AirSense Server (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AirSense.Server/AirSense.Server.csproj

    - name: Build Server
      run: dotnet build AirSense.Server/AirSense.Server.csproj --configuration Release --no-restore

    - name: Publish Windows Standalone Executable
      run: dotnet publish AirSense.Server/AirSense.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/server

    - name: Upload Windows Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Server-Windows
        path: ./publish/server/AirSense.Server.exe

  build-client:
    name: Build AirSense Client (Android APK)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android Project Runner
      run: |
        cd AirSense.Client
        flutter create . --project-name air_sense_client --org com.airsense.controller --platforms=android

    - name: Configure NDK and Permissions
      run: |
        # Locate pre-installed NDK
        PREINSTALLED_NDK=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n 1)
        echo "Found Runner NDK: $PREINSTALLED_NDK"
        
        # Symlink preferred NDK 28.2.13676358 to pre-installed NDK so plugins (:jni) find it immediately
        sudo ln -s "/usr/local/lib/android/sdk/ndk/$PREINSTALLED_NDK" "/usr/local/lib/android/sdk/ndk/28.2.13676358" || true
        
        # Configure ndk.dir in local.properties
        echo "ndk.dir=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> AirSense.Client/android/local.properties

        # Inject networking & vibration permissions into AndroidManifest.xml
        sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>/' AirSense.Client/android/app/src/main/AndroidManifest.xml

    - name: Install Client Dependencies
      run: |
        cd AirSense.Client
        flutter pub get

    - name: Build Android APK
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      run: |
        cd AirSense.Client
        flutter build apk --release --no-tree-shake-icons

    - name: Prepare APK Output
      run: |
        mkdir -p ./release-apk
        cp AirSense.Client/build/app/outputs/flutter-apk/app-release.apk ./release-apk/AirSense-v1.2.0.apk

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSense-Android-APK
        path: ./release-apk/AirSense-v1.2.0.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.2.0-apk
        name: "AirSense Android APK Release v1.2.0 (Vertical Stacking & Vector Redesign)"
        body: |
          ### AirSense Mobile Controller v1.2.0 (Gamepad Ergonomics Redesign)
          - **Direct Download:** Tap [`AirSense-v1.2.0.apk`](https://github.com/ramsforge/AirSense/releases/download/v1.2.0-apk/AirSense-v1.2.0.apk) to install.
          - **What's New in v1.2.0:**
            - **Vertical Control Stacking:** D-Pad on top, Left Stick below; Action Buttons on top, Right Stick below.
            - **Vertical Outer Flanks:** L2/R2 vertical trigger pedals and L1/R1 bumpers on phone edges where index fingers naturally rest.
            - **De-condensed D-Pad:** Full-sized 150px 8-way D-Pad for fluid diagonal rolling without dropped touches.
            - **Vector Face Buttons:** Clean CustomPainter geometry with zero font scaling artifacts.
            - **Dynamic Controller Mode:** Face buttons dynamically adapt symbols and colors between PS5 (`△, ○, ✕, □`) and Xbox 360 (`Y, B, A, X`).
            - **Dedicated Holdable L3 & R3:** Hold sprint or aim while maneuvering the analog sticks.
            - **Real Handshake & Telemetry:** Verified connection with live RTT ping and real device battery telemetry.
          - **Connect:** Start `AirSense.Server.exe` on your PC and tap Connect in the app!
        files: |
          ./release-apk/AirSense-v1.2.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
